<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d16">
  <meta name="description" content="WebCMD — a lightweight interactive command-line playground by Moizz.">
  <title>WebCMD — Moizz</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d16;
      --panel: #111827;
      --panel-2: #0d1421;
      --line: rgba(148,163,184,.16);
      --text: #e5edf8;
      --muted: #8290a5;
      --green: #65e6a5;
      --blue: #7aaeff;
      --red: #ff7b86;
      --shadow: 0 24px 80px rgba(0,0,0,.38);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 36px 18px;
      display: grid; place-items: center;
      background: radial-gradient(ellipse at 15% 0%, rgba(54,105,170,.18), transparent 42%),
                  radial-gradient(ellipse at 90% 100%, rgba(46,160,110,.12), transparent 38%), var(--bg);
      color: var(--text); font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    button, input { font: inherit; }
    .shell { width: min(920px, 100%); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: rgba(17,24,39,.94); box-shadow: var(--shadow); }
    .topbar { display:flex; align-items:center; gap:14px; padding:15px 19px; background:rgba(255,255,255,.025); border-bottom:1px solid var(--line); }
    .traffic { display:flex; gap:7px; }
    .traffic i { width:11px; height:11px; border-radius:50%; display:block; }
    .traffic i:nth-child(1){background:#ff6b6b}.traffic i:nth-child(2){background:#f7c65f}.traffic i:nth-child(3){background:#55d98b}
    .brand { font-weight:700; letter-spacing:.04em; }
    .brand span { color:var(--green); }
    .top-meta { margin-left:auto; color:var(--muted); font-size:12px; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:17px 22px 12px; }
    .heading { margin:0; font:600 18px/1.3 system-ui,sans-serif; letter-spacing:-.02em; }
    .subheading { margin:4px 0 0; color:var(--muted); font:12px system-ui,sans-serif; }
    .actions { display:flex; gap:8px; }
    .tool-btn { border:1px solid var(--line); border-radius:8px; background:#172235; color:#cbd7e8; padding:7px 10px; cursor:pointer; font-size:12px; }
    .tool-btn:hover { border-color:rgba(101,230,165,.5); color:white; }
    .screen { height:420px; overflow:auto; padding:16px 22px 20px; scroll-behavior:smooth; }
    .line { white-space:pre-wrap; overflow-wrap:anywhere; margin:0 0 7px; }
    .line.system { color:var(--muted); }
    .line.success { color:var(--green); }
    .line.error { color:var(--red); }
    .line.command { color:#dce7f7; }
    .prompt { color:var(--green); margin-right:9px; }
    .input-wrap { display:flex; align-items:center; gap:10px; margin:0 22px 17px; padding:12px 14px; border:1px solid rgba(101,230,165,.28); border-radius:10px; background:var(--panel-2); }
    .input-wrap:focus-within { border-color:rgba(101,230,165,.7); box-shadow:0 0 0 3px rgba(101,230,165,.08); }
    .prompt-label { color:var(--green); user-select:none; }
    #command-input { width:100%; min-width:0; border:0; outline:0; background:transparent; color:var(--text); caret-color:var(--green); }
    #command-input::placeholder { color:#64748b; }
    .footer { display:flex; justify-content:space-between; gap:10px; padding:11px 22px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
    .status { color:var(--green); }
    kbd { padding:2px 5px; border:1px solid var(--line); border-radius:4px; color:#b7c4d7; }
    @media(max-width:600px) {
      body { padding:12px 8px; align-items:start; }
      .shell { border-radius:13px; }
      .topbar { padding:12px 14px; }
      .top-meta { font-size:10px; }
      .toolbar { padding:15px 14px 10px; align-items:flex-start; }
      .screen { height:55vh; min-height:300px; padding:14px; }
      .input-wrap { margin:0 14px 14px; }
      .footer { padding:10px 14px; flex-wrap:wrap; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; animation:none!important; } }
  </style>
</head>
<body>
  <main class="shell" aria-label="WebCMD terminal">
    <header class="topbar">
      <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="brand">MOIZZ <span>/</span> WEBCMD</div>
      <div class="top-meta">BROWSER TERMINAL · v4.0</div>
    </header>
    <section class="toolbar">
      <div><h1 class="heading">Command workspace</h1><p class="subheading">A small interactive playground. No real system commands are executed.</p></div>
      <div class="actions"><button class="tool-btn" id="help-btn" type="button">Help</button><button class="tool-btn" id="clear-btn" type="button">Clear</button></div>
    </section>
    <section class="screen" id="output" role="log" aria-live="polite" aria-label="Terminal output">
      <p class="line system">Welcome to WebCMD. Type <strong>help</strong> to see what you can do.</p>
      <p class="line success">Ready · session active</p>
    </section>
    <form class="input-wrap" id="command-form" autocomplete="off">
      <label class="prompt-label" for="command-input">moizz@webcmd:~$</label>
      <input id="command-input" name="command" type="text" placeholder="Type a command…" spellcheck="false" autofocus aria-label="Terminal command">
    </form>
    <footer class="footer"><span><span class="status">● ONLINE</span> · Local browser session</span><span><kbd>↑</kbd> <kbd>↓</kbd> history · <kbd>Tab</kbd> autocomplete</span></footer>
  </main>
  <script>
    (() => {
      const output = document.getElementById('output');
      const input = document.getElementById('command-input');
      const form = document.getElementById('command-form');
      const history = [];
      let historyIndex = 0;
      let todos = [];
      try { todos = JSON.parse(localStorage.getItem('webcmd-todos') || '[]'); if (!Array.isArray(todos)) todos = []; } catch { todos = []; }

      function print(message, kind = '') {
        if (message === '' || message === null || message === undefined) return;
        const row = document.createElement('p');
        row.className = 'line' + (kind ? ' ' + kind : '');
        row.textContent = String(message);
        output.appendChild(row);
        output.scrollTop = output.scrollHeight;
      }
      function clearScreen() { output.replaceChildren(); }
      function saveTodos() {
        try { localStorage.setItem('webcmd-todos', JSON.stringify(todos)); }
        catch { print('Could not save tasks in this browser.', 'error'); }
      }
      function calculate(source) {
        const tokens = source.match(/\d+(?:\.\d+)?|[()+\-*/%]/g) || [];
        if (!tokens.length || tokens.join('') !== source.replace(/\s+/g, '')) throw new Error('Use numbers and + - * / % ( ) only.');
        let i = 0;
        function factor() {
          const token = tokens[i++];
          if (token === '+') return factor();
          if (token === '-') return -factor();
          if (token === '(') { const value = sum(); if (tokens[i++] !== ')') throw new Error('Missing closing parenthesis.'); return value; }
          if (!token || !/^\d+(?:\.\d+)?$/.test(token)) throw new Error('Invalid expression.');
          return Number(token);
        }
        function product() {
          let value = factor();
          while (['*','/','%'].includes(tokens[i])) {
            const op = tokens[i++], right = factor();
            if ((op === '/' || op === '%') && right === 0) throw new Error('Cannot divide by zero.');
            value = op === '*' ? value * right : op === '/' ? value / right : value % right;
          }
          return value;
        }
        function sum() {
          let value = product();
          while (tokens[i] === '+' || tokens[i] === '-') { const op = tokens[i++], right = product(); value = op === '+' ? value + right : value - right; }
          return value;
        }
        const result = sum();
        if (i !== tokens.length || !Number.isFinite(result)) throw new Error('Invalid expression.');
        return Number(result.toFixed(10));
      }
      function setTheme(mode) {
        const root = document.documentElement;
        const themes = {
          dark: { bg:'#090d16', panel:'#111827', panel2:'#0d1421', line:'rgba(148,163,184,.16)', text:'#e5edf8', muted:'#8290a5' },
          light: { bg:'#eef2f8', panel:'#ffffff', panel2:'#f7f9fc', line:'rgba(71,85,105,.2)', text:'#172033', muted:'#64748b' }
        };
        const selected = themes[mode];
        if (!selected) return 'Usage: theme dark | theme light';
        Object.entries(selected).forEach(([key, value]) => root.style.setProperty('--' + key, value));
        document.body.style.background = mode === 'light'
          ? 'radial-gradient(ellipse at 15% 0%, rgba(54,105,170,.10), transparent 42%), var(--bg)'
          : 'radial-gradient(ellipse at 15% 0%, rgba(54,105,170,.18), transparent 42%), radial-gradient(ellipse at 90% 100%, rgba(46,160,110,.12), transparent 38%), var(--bg)';
        try { localStorage.setItem('webcmd-theme', mode); } catch {}
        return 'Theme changed to ' + mode + '.';
      }
      try { setTheme(localStorage.getItem('webcmd-theme') || 'dark'); } catch { setTheme('dark'); }
      const commands = {
        theme: args => setTheme((args[0] || '').toLowerCase()),
        help: () => [
          'Available commands:',
          'help — show this guide',
          'clear — clear the screen',
          'echo <text> — print text',
          'math <expression> — calculate safely',
          'date / time — show local date or time',
          'about / version — app information',
          'quote — random motivational quote',
          'todo add <task> — save a task',
          'todo list — show saved tasks',
          'todo clear — remove saved tasks',
          'theme dark|light — switch appearance',
          'history — list recent commands',
          'count <text> — count words and characters',
          'reverse <text> — reverse text',
          'whoami — show current workspace user'
        ].join(String.fromCharCode(10)),
        history: () => history.length ? history.map((entry, index) => (index + 1) + '. ' + entry).join('\\n') : 'No commands in history yet.',
        count: args => {
          const text = args.join(' ');
          return 'Characters: ' + text.length + ' | Words: ' + (text.trim() ? text.trim().split(/\\s+/).length : 0);
        },
        reverse: args => args.join(' ').split('').reverse().join(''),
        clear: () => { clearScreen(); return ''; },
        echo: args => args.join(' ') || '(empty)',
        math: args => calculate(args.join(' ')),
        calc: args => calculate(args.join(' ')),
        date: () => new Date().toLocaleDateString(undefined, { dateStyle:'full' }),
        time: () => new Date().toLocaleTimeString(),
        about: () => 'WebCMD is a browser-based command playground built with HTML, CSS and JavaScript. It is not a real operating-system terminal.',
        version: () => 'WebCMD 4.0 · Moizz · Vanilla HTML/CSS/JavaScript',
        whoami: () => 'moizz — WebCMD workspace user',
        quote: () => ['Small steps every day add up to big results.','Make it work, make it right, make it better.','Great things are built one commit at a time.'][Math.floor(Math.random()*3)],
        todo: args => {
          const action = (args[0] || '').toLowerCase();
          if (action === 'add' && args.slice(1).length) { const task=args.slice(1).join(' '); todos.push(task); saveTodos(); return 'Added: ' + task; }
          if (action === 'list') return todos.length ? todos.map((task,index)=>(index+1)+'. '+task).join('\n') : 'Your task list is empty.';
          if (action === 'clear') { todos=[]; saveTodos(); return 'Task list cleared.'; }
          return 'Usage: todo add <task> | todo list | todo clear';
        }
      };
      function run(raw) {
        const value = raw.trim();
        if (!value) return;
        print('moizz@webcmd:~$ ' + value, 'command');
        const parts = value.match(/"[^"]*"|'[^']*'|\S+/g) || [];
        const name = parts.shift().toLowerCase();
        const args = parts.map(part => part.replace(/^['"]|['"]$/g, ''));
        if (!Object.prototype.hasOwnProperty.call(commands, name)) { print('Command not found: ' + name + '. Type "help".', 'error'); return; }
        try { const result = commands[name](args); if (result) print(result, 'success'); }
        catch (error) { print(error.message || 'Command failed.', 'error'); }
      }
      form.addEventListener('submit', event => {
        event.preventDefault();
        const value = input.value;
        if (value.trim()) { history.push(value); historyIndex = history.length; run(value); }
        input.value = '';
      });
      input.addEventListener('keydown', event => {
        if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
          event.preventDefault();
          historyIndex = event.key === 'ArrowUp' ? Math.max(0, historyIndex-1) : Math.min(history.length, historyIndex+1);
          input.value = history[historyIndex] || '';
        }
        if (event.key === 'Tab') {
          event.preventDefault();
          const prefix = input.value.trim().toLowerCase();
          const match = Object.keys(commands).find(name => name.startsWith(prefix));
          if (match) input.value = match;
        }
      });
      document.getElementById('help-btn').addEventListener('click', () => { input.value='help'; run(input.value); input.value=''; input.focus(); });
      document.getElementById('clear-btn').addEventListener('click', () => { clearScreen(); input.focus(); });
      document.addEventListener('click', event => { if (!event.target.closest('button')) input.focus(); });
    })();
  </script>
</body>
</html>
